<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignBridge · Lớp 8B1</title><meta name="description" content="SignBridge: cầu nối ký hiệu cho lớp học trực tuyến. Bản demo nguyên mẫu (giọng nói và nhận diện ký hiệu được mô phỏng).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: Meet call screen. Stage of 4 tiles + a white add-on side panel (360px) + pill control bar. On phones the panel stacks under a strip of tiles. Single look, like Meet dark. */
:root{
  color-scheme:dark;
  --stage:#202124;--tile:#3c4043;--ctl:#3c4043;--ctlh:#4d5156;--ink:#e8eaed;--mut:#9aa0a6;
  --pan:#ffffff;--pink:#202124;--pmut:#5f6368;--psurf:#f1f3f4;--psurf2:#e8eaed;--pline:#dadce0;
  --blue:#1a73e8;--blueh:#1765cc;--bsoft:#e8f0fe;--red:#ea4335;--redh:#d93025;--lite:#8ab4f8;--liteInk:#041e49;
  --bar:80px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
  font:14px/1.43 "Google Sans Text","Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lite);outline-offset:2px}
.panel :focus-visible{outline-color:var(--blue)}
svg.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
u{text-decoration:none}

.app{position:relative;height:100%;display:grid;grid-template-rows:minmax(0,1fr) var(--bar);min-width:0;
  padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;min-height:0;min-width:0}
.app.nopanel .main{grid-template-columns:minmax(0,1fr)}
.app.nopanel .panel{display:none}

/* top: demo button (floats over the stage on desktop) */
.top{position:absolute;z-index:6;left:calc(max(16px,env(safe-area-inset-left,0px)) + 12px);top:24px;display:flex;align-items:center;gap:10px}
.top .t{display:none}
.demo{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px 0 10px;border-radius:18px;background:rgba(32,33,36,.84);color:var(--ink);font-weight:500;border:1px solid rgba(255,255,255,.2)}
.demo:hover{background:rgba(60,64,67,.95)}
.demo.on{background:var(--lite);color:var(--liteInk);border-color:transparent}
.demo svg.i{width:20px;height:20px}

/* stage + tiles */
.stage{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;min-height:0;min-width:0}
.tile{position:relative;background:var(--tile);border-radius:12px;overflow:hidden;min-height:0;min-width:0;container-type:inline-size}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 0 var(--lite);transition:box-shadow .2s}
.tile.speaking::after{box-shadow:inset 0 0 0 3px var(--lite)}
.av{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);--d:min(30cqw,132px);width:var(--d);aspect-ratio:1;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff}
.av span{font-size:calc(var(--d) * .46);line-height:1}
.tile.speaking .av{animation:ring 1.5s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.38)}100%{box-shadow:0 0 0 24px rgba(255,255,255,0)}}
.nm{position:absolute;left:14px;right:56px;bottom:10px;font-size:14px;font-weight:500;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu,.spk{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;place-items:center}
.mu{display:grid;background:rgba(32,33,36,.72);color:#fff}
.mu svg.i{width:17px;height:17px}
.tile.you:not(.muted) .mu{display:none}
.spk{display:none;grid-auto-flow:column;place-content:center;align-items:center;gap:2px;background:var(--blue)}
.spk b{width:3px;height:7px;background:#fff;border-radius:2px;animation:eq .8s ease-in-out infinite}
.spk b:nth-child(2){animation-delay:.2s}.spk b:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{height:14px}}
.tile.speaking .spk{display:grid}.tile.speaking .mu{display:none!important}
.room{background:radial-gradient(60% 50% at 18% 22%,rgba(255,255,255,.3),transparent 70%),linear-gradient(180deg,#aab6c2 0%,#8795a3 55%,#66727f 100%)}
.feed{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 8%;display:block}
.tile.you .av{display:none}
.tile.you.camoff{background:var(--tile)}
.tile.you.camoff .feed{display:none}
.tile.you.camoff .av{display:grid}
.chip-h{position:absolute;left:10px;top:10px;display:none;align-items:center;gap:6px;background:var(--lite);color:var(--liteInk);border-radius:16px;padding:4px 12px 4px 6px;font-size:12px;font-weight:500}
.chip-h svg.i{width:16px;height:16px}
.tile.signing .chip-h,.tile.raised .chip-h{display:flex}

/* live captions over the stage (also where the Deaf student's submitted message appears) */
.cc{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));display:flex;flex-direction:column;gap:6px;z-index:5;pointer-events:none}
.cr{display:flex;gap:12px;align-items:flex-start;background:rgba(32,33,36,.95);border-radius:12px;padding:10px 18px 12px 12px;box-shadow:0 2px 10px rgba(0,0,0,.45);animation:up .25s ease-out}
.cr.sgn{box-shadow:0 0 0 2px var(--lite),0 2px 10px rgba(0,0,0,.45)}
.cr u{width:32px;height:32px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.cr .w{min-width:0}
.cr b{display:flex;align-items:center;gap:6px;color:#bdc1c6;font-size:13px;font-weight:500}
.cr b svg.i{width:15px;height:15px;color:var(--lite)}
.cr p{margin:2px 0 0;font-size:18px;line-height:1.4;color:#fff;overflow-wrap:anywhere}
@keyframes up{from{opacity:0;transform:translateY(8px)}}

/* side panel: Meet add-on card */
.panel{display:flex;flex-direction:column;background:var(--pan);color:var(--pink);border-radius:16px;overflow:hidden;min-height:0;min-width:0;color-scheme:light}
.ph{display:flex;align-items:center;gap:12px;padding:14px 8px 6px 20px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.logo svg.i{width:22px;height:22px}
.ph h2{margin:0;flex:1;font-size:19px;font-weight:400;letter-spacing:0}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--pmut)}
.ib:hover{background:var(--psurf)}
.tabs{display:flex;border-bottom:1px solid var(--pline);padding:0 8px}
.tabs button{flex:1;position:relative;height:48px;color:var(--pmut);font-weight:500;font-size:14px}
.tabs button:hover{color:var(--pink)}
.tabs button[aria-selected=true]{color:var(--blue)}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--blue)}
.tabs button.dot::before{content:"";position:absolute;top:13px;left:calc(50% + 22px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.views{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.view{display:none;flex-direction:column;gap:14px;padding:16px}
.view.on{display:flex}

/* Watch */
.avw{position:relative;border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#5b7189,#2a3747);height:min(40vh,304px);aspect-ratio:1;max-width:100%;margin:0 auto;cursor:pointer;flex:none}
.avw.on{outline:3px solid var(--c);outline-offset:-3px}
.avw canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pill{transition:opacity .2s;position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;background:rgba(32,33,36,.74);border-radius:20px;padding:4px 14px 4px 4px;color:#fff;font-weight:500;max-width:calc(100% - 96px)}
.pill u{width:28px;height:28px;border-radius:50%;background:var(--c,#5f6368);display:grid;place-items:center;font-size:13px;flex:none}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q{position:absolute;right:10px;top:10px;background:var(--lite);color:var(--liteInk);font-weight:500;font-size:12px;padding:4px 10px;border-radius:14px}
.q[hidden]{display:none}
.idle{position:absolute;left:0;right:0;bottom:52px;text-align:center;color:#c7d2e0;font-size:13px;pointer-events:none;transition:opacity .2s}
.spd{position:absolute;right:8px;bottom:8px;display:flex;background:rgba(32,33,36,.74);border-radius:16px;padding:2px}
.spd button{padding:3px 10px;border-radius:14px;font-size:12px;color:#bdc1c6}
.spd button[aria-pressed=true]{background:#fff;color:#202124;font-weight:500}
.sc{display:flex;gap:12px;align-items:flex-start;background:var(--psurf);border-radius:12px;padding:12px 14px;min-height:76px}
.sc u{width:36px;height:36px;border-radius:50%;background:var(--c,#9aa0a6);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.sc div{min-width:0}
.sc b{font-size:13px;font-weight:500;color:var(--pmut)}
.sc p{margin:2px 0 0;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-height:34px;align-items:center;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;display:inline-flex;align-items:center;padding:0 14px;border-radius:16px;border:1px solid var(--pline);font-size:13px;font-weight:500;color:var(--pink);background:#fff;transition:background .15s,color .15s}
.chip.now{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.fs{border-style:dashed;color:var(--pmut)}
.chip.load{border-style:dashed;color:var(--pmut);letter-spacing:.2em}
.demo-box{border:1px dashed var(--pline);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.demo-box h3{margin:0;font-size:12px;font-weight:500;color:var(--pmut)}
.ppl{display:flex;gap:8px}
.ppl button{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 4px;border-radius:20px;border:1px solid var(--pline);font-weight:500}
.ppl button u{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.ppl button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppl button[aria-pressed=true]{background:var(--bsoft);border-color:var(--blue);color:var(--blue)}
.say{display:flex;gap:8px}
.say input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--pline);padding:0 16px;font:inherit;color:var(--pink);background:#fff}
.say input::placeholder{color:#80868b}
.fab{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.fab:hover{background:var(--blueh)}
.qp{display:flex;flex-direction:column;gap:6px}
.qp button{text-align:left;padding:9px 14px;border-radius:12px;background:var(--psurf);font-size:14px}
.qp button:hover{background:var(--psurf2)}

/* Sign (You) */
.camw{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;flex:none}
.camw.off{background:#3c4043}
.camw.off .feed{display:none}
.camw.off::after{content:"Camera is off";position:absolute;inset:0;display:grid;place-items:center;color:#bdc1c6}
.rec{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(32,33,36,.74);color:#fff;border-radius:14px;padding:3px 11px 3px 9px;font-size:12px;font-weight:500}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.st{position:absolute;left:10px;bottom:10px;background:rgba(32,33,36,.74);color:#fff;border-radius:14px;padding:4px 12px;font-size:13px}
.opts{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lang{display:flex;background:var(--psurf);border-radius:16px;padding:2px}
.lang button{padding:3px 14px;border-radius:14px;font-size:12px;font-weight:500;color:var(--pmut)}
.lang button[aria-pressed=true]{background:var(--blue);color:#fff}
.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:32px}
.seq[hidden],.sent[hidden],.start[hidden],.btn[hidden]{display:none}
.seq .chip{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.sent{background:var(--bsoft);border-radius:14px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;animation:up .3s ease-out}
.sent .lbl{color:var(--blue);font-weight:500;font-size:13px;display:flex;gap:6px;align-items:center}
.sent .lbl svg.i{width:18px;height:18px}
.sent p{margin:0;font-size:20px;line-height:1.4;color:#1f1f1f;overflow-wrap:anywhere}
.row{display:flex;gap:8px}
.btn{height:44px;border-radius:22px;padding:0 20px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.btn svg.i{width:20px;height:20px}
.btn.f{background:var(--blue);color:#fff}
.row .btn.f{flex:1}
.start .btn,#cancel{width:100%}
.btn.f:hover{background:var(--blueh)}
.btn.o{border:1px solid var(--pline);color:var(--blue);background:#fff}
.btn.o:hover{background:var(--bsoft)}
.btn:disabled{opacity:.45;cursor:default}
.start{display:flex;flex-direction:column;gap:12px}
.samples{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.samples::-webkit-scrollbar{display:none}
.samples button{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--psurf);font-size:13px;white-space:nowrap}
.samples button:hover{background:var(--psurf2)}

/* Library + chat */
.find{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;background:var(--psurf);padding:0 14px;color:var(--pmut)}
.find input{flex:1;border:0;background:none;font:inherit;outline:none;min-width:0;color:var(--pink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lib button{height:44px;border-radius:12px;background:var(--psurf);font-size:13px;font-weight:500;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib button:hover{background:var(--psurf2)}
.log{display:flex;flex-direction:column;gap:16px}
.ln{display:flex;gap:12px}
.ln u{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.ln .h{display:flex;align-items:center;gap:6px}
.ln b{font-weight:500}
.ln .sg{color:var(--blue);display:flex}.ln .sg svg.i{width:16px;height:16px}
.ln time{color:var(--pmut);font-size:12px}
.ln p{margin:2px 0 0;overflow-wrap:anywhere}
.empty{color:var(--pmut);text-align:center;padding:32px 0}

/* control bar */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;min-width:0}
.ci{display:flex;gap:12px;color:var(--ink);font-size:16px;white-space:nowrap;overflow:hidden;align-items:center}
.ci i{width:1px;height:20px;background:#5f6368}
.cm{display:flex;gap:8px;align-items:center;justify-content:center}
.cb{position:relative;width:48px;height:48px;border-radius:50%;background:var(--ctl);display:grid;place-items:center;color:var(--ink);flex:none;transition:background .15s}
.cb:hover{background:var(--ctlh)}
.cb.on{background:var(--lite);color:var(--liteInk)}
.cb.off{background:var(--red);color:#fff}
.pg{display:flex;border-radius:24px;background:var(--ctl);overflow:hidden;flex:none}
.pg.off{background:var(--red)}
.pg .cb{background:none;border-radius:0}
.pg .cb:hover{background:rgba(255,255,255,.12)}
.pg .cb.c{width:30px;padding-right:6px}
.pg .cb.c svg.i{width:20px;height:20px}
.end{width:64px;border-radius:24px;background:var(--red);color:#fff}
.end:hover{background:var(--redh)}
.cr2{display:flex;justify-content:flex-end;gap:4px}
.cr2 .cb{background:none}
.cr2 .cb:hover{background:var(--ctlh)}
.cr2 .cb.on{background:rgba(138,180,248,.22);color:var(--lite)}
.bd{position:absolute;right:2px;top:2px;min-width:18px;height:18px;border-radius:9px;background:#5f6368;color:#fff;font-size:11px;font-weight:500;display:grid;place-items:center;padding:0 4px}
.lg28{width:28px;height:28px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:#fff}
.lg28 svg.i{width:18px;height:18px}
.sbm{display:none}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 20px);transform:translateX(-50%);background:#e8eaed;color:#202124;padding:10px 20px;border-radius:8px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

@media (max-width:1180px){.ci{display:none}.ctl{grid-template-columns:1fr auto 1fr}.rx,.pr{display:none}}
@media (max-width:900px){
  :root{--bar:76px}
  .toast{top:auto;bottom:calc(var(--bar) + 12px + env(safe-area-inset-bottom,0px))}
  .app{grid-template-rows:auto minmax(0,1fr) var(--bar);padding-top:6px}
  .top{position:static;height:44px;justify-content:space-between;width:100%}
  .top .t{display:flex;flex-direction:column;line-height:1.2}
  .top .t b{font-size:16px;font-weight:500}.top .t span{font-size:12px;color:var(--mut)}
  .main{display:flex;flex-direction:column;gap:8px}
  .stage{flex:1 1 0}
  .av{--d:min(46cqw,120px)}
  .app:not(.nopanel) .stage{flex:0 0 24%;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
  .app:not(.nopanel) .av{--d:min(62cqw,84px)}
  .app:not(.nopanel) .nm{left:6px;right:6px;bottom:6px;font-size:12px}
  .app:not(.nopanel) .mu,.app:not(.nopanel) .spk{width:20px;height:20px;top:6px;right:6px}
  .app:not(.nopanel) .mu svg.i{width:12px;height:12px}
  .app:not(.nopanel) .chip-h{left:6px;top:6px;padding:2px 6px}
  .app:not(.nopanel) .chip-h span{display:none}
  .panel{flex:1 1 0}
  .avw{height:min(32vh,280px)}
  .cc{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 54px);bottom:auto;transform:none;width:auto}
  .cr2,.ci,.mo,.rx,.pr{display:none}
  .ctl{grid-template-columns:1fr}
  .cm{gap:8px}
  .pg{display:contents}
  .pg .c{display:none}
  .pg .cb{background:var(--ctl);border-radius:50%}
  .pg.off .cb.m{background:var(--red)}
  .cb{width:46px;height:46px}.end{width:58px;border-radius:24px}
  .sbm{display:grid}
}
@media (max-width:520px){
  .view{padding:12px;gap:12px}
  .ph{padding:10px 4px 4px 16px}
  .tabs button{font-size:13px}
  .cm{gap:6px}.cb{width:44px;height:44px}.end{width:54px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="app" id="app">
  <header class="top">
    <div class="t"><b>Lớp 8B1</b><span id="clk2"></span></div>
    <button class="demo" id="demo" aria-label="Play demo"><span id="demoI" data-i="play"></span><span id="demoT">Demo</span></button>
  </header>

  <main class="main">
    <section class="stage" id="stage" aria-label="Participants">
      <div class="cc" id="cc" aria-live="polite"></div>
    </section>

    <aside class="panel" id="panel" aria-label="SignBridge">
      <div class="ph">
        <div class="logo"><span data-i="hand"></span></div>
        <h2>SignBridge</h2>
        <button class="ib" id="xp" aria-label="Close"><span data-i="close"></span></button>
      </div>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" aria-selected="true" data-t="watch">Xem</button>
        <button role="tab" aria-selected="false" data-t="sign">Ký hiệu</button>
        <button role="tab" aria-selected="false" data-t="lib">Thư viện</button>
        <button role="tab" aria-selected="false" data-t="log">Tin nhắn</button>
      </div>
      <div class="views" id="views">

        <section class="view on" id="v-watch">
          <div class="avw" id="avw">

<script>
/* ===== 1. AVATAR ENGINE: two-arm IK + five-finger hands on canvas. Renders to several canvases. ===== */
const CONFIG={size:[640,640],handScale:.9,depthScale:.0008,body:{shoulderL:[205,222],shoulderR:[435,222],upperArm:180,foreArm:160}};
const LOOK_AV={skin:'#e6b58f',skinLight:'#f0c7a6',skinLine:'#6f4128',shirt:'#3f6ea8',shirtDark:'#2f5588',shirtLine:'#1c3557',hair:'#2a211d'};
const LOOK_CAM={skin:'#d9a982',skinLight:'#e8bf9b',skinLine:'#6b4630',shirt:'#6b7a8f',shirtDark:'#56657a',shirtLine:'#37465a',hair:'#1f1815'};
const PALM=[[-19,8],[-30,-2],[-41,-16],[-44,-37],[-38,-56],[-27,-70],[-9,-77],[9,-74],[25,-65],[32,-46],[31,-22],[26,-4],[19,8]];
const CREASES=[[[-34,-44],[-8,-38],[-12,-4]],[[28,-30],[0,-40],[-26,-36]]];
const FINGERS=[
 {thumb:true,base:[-28,-12],angle:-30,len:[34,27,22],width:[23,19,16],maxBend:[25,55,55],spread:-20},
 {base:[-24,-67],angle:-5,len:[38,24,19],width:[15,13,11],maxBend:[80,95,65],spread:-12},
 {base:[-8,-73],angle:-1,len:[42,27,20],width:[16,14,12],maxBend:[80,95,65],spread:-3},
 {base:[8,-70],angle:4,len:[38,25,19],width:[15,13,11],maxBend:[80,95,65],spread:7},
 {base:[23,-61],angle:10,len:[30,19,16],width:[13,11,9],maxBend:[80,95,65],spread:16}];
/* H(x,y,depth,rotation,curl[thumb..pinky],spread,elbowOut). Placeholder shapes: swap for validated VSL data later. */
const H=(x,y,z=0,rot=0,curl=[0,0,0,0,0],spread=.3,elbow=.35)=>({x,y,z,rot,curl,spread,elbow});
const OPEN=[0,0,0,0,0],FIST=[1,1,1,1,1],RELAX=[.3,.3,.35,.4,.45];
const RL=H(262,440,90,165,RELAX,.15,.15),RR=H(378,440,90,-165,RELAX,.15,.15);
const REST={L:RL,R:RR};
const CAM_REST={L:H(262,575,90,165,RELAX,.15,.15),R:H(378,575,90,-165,RELAX,.15,.15)};
const [W,HT]=CONFIG.size,R=Math.PI/180;
let ctx=null,CL=LOOK_AV;

function smooth(pts){ctx.moveTo(pts[0][0],pts[0][1]);for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);}}
function digitPoints(h){return FINGERS.map((f,i)=>{const pts=[[f.base[0],f.base[1]]];let x=f.base[0],y=f.base[1],cum=0;
  for(let j=0;j<3;j++){cum+=h.curl[i]*f.maxBend[j];const ang=(f.angle+h.spread*f.spread+(f.thumb?cum:0))*R;let L=f.len[j];if(!f.thumb)L*=Math.cos(cum*R);x+=Math.sin(ang)*L;y-=Math.cos(ang)*L;pts.push([x,y]);}
  return pts;});}
function strokeDigit(pts,f,extra,color){ctx.strokeStyle=color;ctx.lineCap=ctx.lineJoin='round';for(let j=0;j<3;j++){ctx.lineWidth=f.width[j]+extra;ctx.beginPath();ctx.moveTo(pts[j][0],pts[j][1]);ctx.lineTo(pts[j+1][0],pts[j+1][1]);ctx.stroke();}}
function handBox(h,side,scale,D){
  const a=h.rot*R,ca=Math.cos(a),sa=Math.sin(a);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of PALM.concat(...D)){const x=side*scale*p[0],y=scale*p[1],X=h.x+x*ca-y*sa,Y=h.y+x*sa+y*ca;x0=Math.min(x0,X);y0=Math.min(y0,Y);x1=Math.max(x1,X);y1=Math.max(y1,Y);}
  return{x0:x0-14,y0:y0-14,x1:x1+14,y1:y1+14,c:side>0?'98%':'97%'};}
function drawBox(b){
  if(b.y0>600)return;
  ctx.save();ctx.strokeStyle='#81c995';ctx.lineWidth=3;ctx.lineCap='round';const L=20;
  [[b.x0,b.y0,1,1],[b.x1,b.y0,-1,1],[b.x0,b.y1,1,-1],[b.x1,b.y1,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.beginPath();ctx.moveTo(x,y+sy*L);ctx.lineTo(x,y);ctx.lineTo(x+sx*L,y);ctx.stroke();});
  ctx.font='600 22px Roboto,system-ui,sans-serif';const t='Hand '+b.c,w=ctx.measureText(t).width+18;
  ctx.fillStyle='#1e8e3e';ctx.beginPath();ctx.roundRect(b.x0,b.y0-34,w,30,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(t,b.x0+9,b.y0-12);ctx.restore();}
function drawHand(h,side,scale,boxes){
  const D=digitPoints(h);if(boxes)boxes.push(handBox(h,side,scale,D));
  ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot*R);ctx.scale(side*scale,scale);
  const under=[],over=[];D.forEach((p,i)=>(h.curl[i]<.5?under:over).push(i));
  under.forEach(i=>strokeDigit(D[i],FINGERS[i],3,CL.skinLine));
  const g=ctx.createLinearGradient(-40,-77,30,8);g.addColorStop(0,CL.skinLight);g.addColorStop(1,CL.skin);
  ctx.fillStyle=g;ctx.strokeStyle=CL.skinLine;ctx.lineWidth=3;ctx.beginPath();smooth(PALM);ctx.fill();ctx.stroke();
  ctx.save();ctx.globalAlpha=.28;ctx.lineWidth=1.6;ctx.lineCap='round';
  CREASES.forEach(c=>{ctx.beginPath();ctx.moveTo(c[0][0],c[0][1]);ctx.quadraticCurveTo(c[1][0],c[1][1],c[2][0],c[2][1]);ctx.stroke();});ctx.restore();
  under.forEach(i=>strokeDigit(D[i],FINGERS[i],0,CL.skin));
  over.forEach(i=>{strokeDigit(D[i],FINGERS[i],3,CL.skinLine);strokeDigit(D[i],FINGERS[i],0,CL.skin);});
  ctx.save();ctx.globalAlpha=.3;ctx.strokeStyle=CL.skinLine;ctx.lineWidth=1.3;ctx.lineCap='round';
  D.forEach((pts,i)=>{if(h.curl[i]>.5)return;for(const j of [1,2]){const dx=pts[j+1][0]-pts[j-1][0],dy=pts[j+1][1]-pts[j-1][1],m=Math.hypot(dx,dy)||1,nx=-dy/m,ny=dx/m,hw=FINGERS[i].width[j]*.28;
    ctx.beginPath();ctx.moveTo(pts[j][0]-nx*hw,pts[j][1]-ny*hw);ctx.lineTo(pts[j][0]+nx*hw,pts[j][1]+ny*hw);ctx.stroke();}});
  ctx.restore();
  if(boxes){ /* hand-tracking landmarks, drawn in the hand's own space */
    const k=1/scale;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='rgba(138,180,248,.95)';ctx.lineWidth=2.6*k;
    D.forEach(pts=>{ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(pts[0][0],pts[0][1]);pts.forEach((p,j)=>{if(j)ctx.lineTo(p[0],p[1]);});ctx.stroke();});
    ctx.fillStyle='#fff';ctx.strokeStyle='#1a73e8';ctx.lineWidth=2*k;
    [[0,6]].concat(...D).forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4*k,0,7);ctx.fill();ctx.stroke();});
    ctx.restore();}
  ctx.restore();}
function solveArm(S,T,a,b,side,out){
  const v=[T[0]-S[0],T[1]-S[1],T[2]-S[2]],d0=Math.hypot(...v)||1,d=Math.min(a+b-.5,Math.max(Math.abs(a-b)+.5,d0)),u=v.map(k=>k/d0);
  const wr=[S[0]+u[0]*d,S[1]+u[1]*d,S[2]+u[2]*d],ca=(a*a+d*d-b*b)/(2*a*d),sa=Math.sqrt(Math.max(0,1-ca*ca));
  const pole=[side*out,1,-.15],dot=pole[0]*u[0]+pole[1]*u[1]+pole[2]*u[2];
  let n=pole.map((k,i)=>k-u[i]*dot);const nl=Math.hypot(...n);n=nl>1e-3?n.map(k=>k/nl):[side,0,0];
  return{elbow:[0,1,2].map(i=>S[i]+u[i]*a*ca+n[i]*a*sa),wrist:wr};}
function sleeve(S,E,Wr){for(const pass of [0,1]){const ex=pass?0:4,col=pass?CL.shirt:CL.shirtLine;ctx.strokeStyle=col;ctx.fillStyle=col;
  ctx.lineCap='round';ctx.lineWidth=42+ex;ctx.beginPath();ctx.moveTo(S[0],S[1]);ctx.lineTo(E[0],E[1]);ctx.stroke();
  ctx.beginPath();ctx.arc(E[0],E[1],(36+ex)/2,0,7);ctx.fill();
  ctx.lineCap='butt';ctx.lineWidth=36+ex;ctx.beginPath();ctx.moveTo(E[0],E[1]);ctx.lineTo(Wr[0],Wr[1]);ctx.stroke();
  ctx.beginPath();ctx.arc(Wr[0],Wr[1],(30+ex)/2,0,7);ctx.fill();}}
function cuff(Wr,rot){const a=rot*R,dx=-Math.sin(a),dy=Math.cos(a);
  for(const pass of [0,1]){ctx.strokeStyle=pass?CL.shirt:CL.shirtLine;ctx.lineCap='butt';ctx.lineWidth=34+(pass?0:4);ctx.beginPath();ctx.moveTo(Wr[0]+dx*22,Wr[1]+dy*22);ctx.lineTo(Wr[0],Wr[1]);ctx.stroke();}
  ctx.strokeStyle=CL.shirtLine;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(Wr[0]-dy*17,Wr[1]+dx*17);ctx.lineTo(Wr[0]+dy*17,Wr[1]-dx*17);ctx.stroke();}
function drawBody(){
  ctx.fillStyle=CL.shirtDark;ctx.strokeStyle=CL.shirtLine;ctx.lineWidth=3;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(150,HT);ctx.lineTo(160,292);ctx.quadraticCurveTo(165,208,246,196);ctx.lineTo(394,196);ctx.quadraticCurveTo(475,208,480,292);ctx.lineTo(490,HT);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=CL.skin;ctx.strokeStyle=CL.skinLine;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(296,140,48,70,14);ctx.fill();ctx.stroke();
  ctx.fillStyle=CL.shirtDark;ctx.beginPath();ctx.moveTo(290,196);ctx.lineTo(320,226);ctx.lineTo(350,196);ctx.closePath();ctx.fill();
  ctx.fillStyle=CL.hair;ctx.beginPath();ctx.ellipse(320,92,60,72,0,0,7);ctx.fill();
  ctx.fillStyle=CL.skin;ctx.strokeStyle=CL.skinLine;ctx.lineWidth=2.5;
  [[262,100],[378,100]].forEach(e=>{ctx.beginPath();ctx.ellipse(e[0],e[1],8,13,0,0,7);ctx.fill();ctx.stroke();});
  ctx.beginPath();ctx.ellipse(320,102,54,64,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=CL.hair;ctx.beginPath();ctx.ellipse(320,86,58,56,0,Math.PI*1.02,Math.PI*1.98);ctx.fill();
  ctx.fillStyle=CL.skinLine;[[300,100],[340,100]].forEach(e=>{ctx.beginPath();ctx.ellipse(e[0],e[1],4,5,0,0,7);ctx.fill();});
  ctx.strokeStyle=CL.hair;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(291,86);ctx.quadraticCurveTo(300,80,309,85);ctx.moveTo(331,85);ctx.quadraticCurveTo(340,80,349,86);ctx.stroke();
  ctx.strokeStyle=CL.skinLine;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(320,104);ctx.quadraticCurveTo(315,118,322,120);ctx.stroke();
  ctx.beginPath();ctx.moveTo(303,132);ctx.quadraticCurveTo(320,142,337,132);ctx.stroke();}

const CTXS=new WeakMap();
function paintRig(c,pose,look,lm,z){z=z||1;
  if(!c||!c.offsetParent)return;
  let x=CTXS.get(c);if(!x){x=c.getContext('2d');CTXS.set(c,x);}
  ctx=x;CL=look;
  if(c.width!==W){c.width=W;c.height=HT;}
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,HT);ctx.setTransform(z,0,0,z,(W-W*z)/2,z<1?72:0);drawBody();
  const B=CONFIG.body,boxes=lm?[]:null;
  [['L',-1,B.shoulderL],['R',1,B.shoulderR]].forEach(([k,side,sh])=>{
    const h=pose[k],arm=solveArm([sh[0],sh[1],0],[h.x,h.y,h.z],B.upperArm,B.foreArm,side,h.elbow),s=CONFIG.handScale*(1+h.z*CONFIG.depthScale);
    sleeve(sh,arm.elbow,arm.wrist);drawHand({...h,x:arm.wrist[0],y:arm.wrist[1]},side,s,boxes);cuff(arm.wrist,h.rot);});
  if(boxes)boxes.forEach(drawBox);}

const lerp=(a,b,t)=>a+(b-a)*t;
const mixHand=(A,B,t)=>({x:lerp(A.x,B.x,t),y:lerp(A.y,B.y,t),z:lerp(A.z,B.z,t),rot:lerp(A.rot,B.rot,t),spread:lerp(A.spread,B.spread,t),elbow:lerp(A.elbow,B.elbow,t),curl:A.curl.map((v,i)=>lerp(v,B.curl[i],t))});
const clone=o=>JSON.parse(JSON.stringify(o));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
class Rig{
  constructor(p){this.cur=clone(p);this.from=clone(p);this.to=clone(p);this.t0=0;this.dur=1;this.lm=false;}
  go(p,ms){this.from=clone(this.cur);this.to=p;this.t0=performance.now();this.dur=Math.max(1,ms);}
  tick(now){const e=ease(Math.max(0,Math.min(1,(now-this.t0)/this.dur)));this.cur={L:mixHand(this.from.L,this.to.L,e),R:mixHand(this.from.R,this.to.R,e)};}}
const avRig=new Rig(REST),camRig=new Rig(CAM_REST);
function frame(now){
  avRig.tick(now);camRig.tick(now);
  paintRig(document.getElementById('cv'),avRig.cur,LOOK_AV,false);
  paintRig(document.getElementById('cv2'),camRig.cur,LOOK_CAM,camRig.lm,.86);
  paintRig(document.getElementById('cv3'),camRig.cur,LOOK_CAM,false,.86);
  requestAnimationFrame(frame);}
</script>

const ic=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(IC[n]||'')+'"/></svg>';
const paint=root=>(root||document).querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=ic(e.dataset.i);});

const PEOPLE={
 lan:{n:'Cô Lan',ini:'L',c:'#1a73e8',r:'teacher'},
 minh:{n:'Minh',ini:'M',c:'#188038',r:'student'},
 sarah:{n:'Sarah',ini:'S',c:'#b06000',r:'guest'},
 you:{n:'Bạn',ini:'B',c:'#a142f4',r:'student'}};
const QP={
 lan:['Chào cả lớp, hôm nay chúng ta học bài mới.','Em có hiểu bài không?','Bài tập nộp vào ngày mai nhé.','Cô sẽ nói chậm hơn.'],
 minh:['Cô ơi, em có câu hỏi.','Mình chia sẻ màn hình nhé.','Bạn làm xong bài tập chưa?','Em chưa hiểu bài ạ.'],
 sarah:['Welcome everyone, please turn on your camera.','Do you have any questions?','Today we will learn about energy.','Great work, thank you!']};

let queue=[],busy=false,spd=1,tok=0,lastMsg=null,ccOn=true,mute=false,camOff=false,who='lan',curTab='watch',demoOn=false,demoRun=0;
const rec={state:'idle',tok:0,i:0,lang:'vi',next:0};

function buildStage(){
  const st=$('stage');
  ['lan','minh','sarah','you'].forEach(id=>{
    const p=PEOPLE[id],t=document.createElement('div');
    t.className='tile'+(id==='you'?' you room':'');t.id='t-'+id;t.style.setProperty('--c',p.c);
    t.innerHTML=(id==='you'?'<canvas class="feed" id="cv3" aria-label="Your camera"></canvas>':'')
      +'<div class="av"><span>'+p.ini+'</span></div>'
      +(id==='you'?'<div class="chip-h">'+ic('hand')+'<span id="hchip">Đang ký hiệu</span></div>':'')
      +'<div class="mu">'+ic('micoff')+'</div><div class="spk"><b></b><b></b><b></b></div><div class="nm">'+p.n+'</div>';
    st.insertBefore(t,$('cc'));
  });
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);requestAnimationFrame(()=>e.classList.add('on'));setTimeout(()=>e.classList.remove('on'),1800);setTimeout(()=>e.remove(),2200);}

/* captions over the stage; the Deaf student's submitted message uses the same rows, highlighted */
let ccRows=[],ccTimer=0;
function addCC(p,text,signed){
  const r=document.createElement('div');r.className='cr'+(signed?' sgn':'');r.style.setProperty('--c',p.c);
  r.innerHTML='<u></u><div class="w"><b><span></span>'+(signed?ic('hand'):'')+'</b><p></p></div>';
  r.querySelector('u').textContent=p.ini;r.querySelector('b span').textContent=p.n;r.querySelector('p').textContent=text;
  $('cc').appendChild(r);ccRows.push(r);
  while(ccRows.length>2)ccRows.shift().remove();
  clearTimeout(ccTimer);ccTimer=setTimeout(clearCC,signed?9000:7000);
}
function clearCC(){ccRows.forEach(r=>r.remove());ccRows=[];}

function addLog(p,text,signed){
  const l=$('log');if(l.querySelector('.empty'))l.innerHTML='';
  const d=document.createElement('div');d.className='ln';d.style.setProperty('--c',p.c);
  const u=document.createElement('u');u.textContent=p.ini;
  const w=document.createElement('div'),h=document.createElement('div');h.className='h';
  const b=document.createElement('b');b.textContent=p.n;h.append(b);
  if(signed){const s=document.createElement('span');s.className='sg';s.innerHTML=ic('hand');h.append(s);}
  const tm=document.createElement('time');tm.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});h.append(tm);
  const pp=document.createElement('p');pp.textContent=text;w.append(h,pp);d.append(u,w);l.appendChild(d);
  if(curTab==='log')$('views').scrollTop=1e9;
}
function setSpeaker(p,text){
  const avw=$('avw');avw.style.setProperty('--c',p?p.c:'transparent');avw.classList.toggle('on',!!p);
  const pill=$('pill');pill.style.setProperty('--c',p?p.c:'#5f6368');
  pill.innerHTML=p?'<u>'+p.ini+'</u><span></span>':'<u>·</u><span>Đang chờ</span>';
  if(p)pill.querySelector('span').textContent=p.n;
  $('sc').style.setProperty('--c',p?p.c:'#9aa0a6');
  $('scu').textContent=p?p.ini:'·';$('scn').textContent=p?p.n:'Trực tiếp';$('sct').textContent=text||'Lời nói trong lớp sẽ hiện ở đây.';
  pill.style.opacity=p?1:0;
}
function setChips(list){
  const c=$('chips');c.innerHTML='';
  if(!list.length){c.innerHTML='<span class="chip fs">chỉ có phụ đề</span>';return;}
  list.forEach(g=>{const s=document.createElement('span');s.className='chip'+(g.startsWith('SPELL:')?' fs':'');s.textContent=label(g);c.appendChild(s);});
}
function updQ(){const q=$('q');q.hidden=!queue.length;q.textContent='+'+queue.length+' câu tiếp';}
async function signs(list,my){
  const chips=[...$('chips').children],box=$('chips');
  for(let i=0;i<list.length;i++){
    if(my!==tok)return;
    chips.forEach((c,k)=>c.classList.toggle('now',k===i));
    const ch=chips[i];if(ch)box.scrollLeft=ch.offsetLeft-box.clientWidth/2+ch.offsetWidth/2;
    const sp=list[i].startsWith('SPELL:');
    for(const k of keysFor(list[i])){if(my!==tok)return;avRig.go(k,(sp?250:400)/spd);await sleep((sp?300:520)/spd);}
    await sleep(110/spd);
  }
  chips.forEach(c=>c.classList.remove('now'));
}
async function deliver(m,my){
  const p=PEOPLE[m.who],t=$('t-'+m.who);
  setSpeaker(p,m.text);
  if(!m.replay){addLog(p,m.text);if(ccOn)addCC(p,m.text,false);}
  if(curTab!=='watch'){if(rec.state==='idle')tab('watch');else document.querySelector('#tabs [data-t=watch]').classList.add('dot');}
  const gl=toGloss(m.text,p.r);setChips(gl);
  t.classList.add('speaking');setTimeout(()=>t.classList.remove('speaking'),Math.max(1600,m.text.length*65)/spd);
  await sleep(250);await signs(gl,my);
  if(my===tok)avRig.go(clone(REST),500/spd);
}
async function pump(){
  if(busy)return;busy=true;const my=tok;
  while(queue.length&&my===tok){const m=queue.shift();updQ();lastMsg=m;await deliver(m,my);await sleep(350);}
  if(my===tok)busy=false;
}
function say(id,text,replay){text=(text||'').trim();if(!text)return;queue.push({who:id,text,replay});updQ();pump();}
async function settle(){while(busy||queue.length)await sleep(150);}
function preview(g){
  if(busy)return;tab('watch');busy=true;const my=tok;
  setSpeaker({n:'Thư viện ký hiệu',ini:'✦',c:'#a142f4'},label(g));setChips([g]);
  signs([g],my).then(()=>{if(my===tok){avRig.go(clone(REST),500);busy=false;}});
}

/* ===== 6. YOU: camera -> sign sequence -> sentence -> Submit -> overlay for everyone ===== */
const recSt=t=>{$('st').textContent=t;};
function speak(t,l){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l==='vi'?'vi-VN':'en-US';speechSynthesis.speak(u);}catch(e){}}
function chipText(){$('hchip').textContent=$('t-you').classList.contains('signing')?'Đang ký hiệu':'Giơ tay';}
function resetSignUI(){
  $('start').hidden=false;$('sent').hidden=true;$('seq').hidden=true;$('seq').innerHTML='';$('cancel').hidden=true;
  camRig.lm=false;$('t-you').classList.remove('signing');chipText();camRig.go(clone(CAM_REST),500);recSt('Đưa hai tay vào khung hình');
}
function addSeq(g){const c=document.createElement('span');c.className='chip'+(g.startsWith('SPELL:')?' fs':'');c.textContent=label(g);$('seq').appendChild(c);}
async function startSign(i){
  if(camOff){toast('Hãy bật camera trước');return;}
  if(rec.state!=='idle'){return;}
  if(i==null){i=rec.next;rec.next=(rec.next+1)%PRESETS.length;}
  rec.i=i;const my=++rec.tok;rec.state='signing';
  $('start').hidden=true;$('sent').hidden=true;$('seq').innerHTML='';$('seq').hidden=false;$('cancel').hidden=false;
  $('t-you').classList.add('signing');chipText();camRig.lm=true;recSt('Đang đọc ký hiệu');
  const Pz=PRESETS[i];
  await sleep(500);
  for(let k=0;k<Pz.s.length;k++){
    for(const kf of keysFor(Pz.s[k])){if(my!==rec.tok)return;camRig.go(kf,400);await sleep(540);}
    if(my!==rec.tok)return;
    addSeq(Pz.s[k]);await sleep(160);
  }
  if(my!==rec.tok)return;
  camRig.go(clone(CAM_REST),500);rec.state='think';recSt('Đang hiểu câu');
  const th=document.createElement('span');th.className='chip load';th.textContent='···';$('seq').appendChild(th);
  await sleep(1000);if(my!==rec.tok)return;
  th.remove();camRig.lm=false;$('t-you').classList.remove('signing');chipText();
  rec.state='review';recSt('Kiểm tra tin nhắn');$('cancel').hidden=true;
  $('sentT').textContent=Pz[rec.lang];$('sent').hidden=false;
  setTimeout(()=>{$('views').scrollTop=1e9;},50);
}
function cancelSign(){rec.tok++;rec.state='idle';resetSignUI();}
function redoSign(){const i=rec.i;rec.tok++;rec.state='idle';resetSignUI();startSign(i);}
function submit(){
  if(rec.state!=='review')return;
  const t=PRESETS[rec.i][rec.lang],p=PEOPLE.you;rec.tok++;rec.state='idle';resetSignUI();
  addLog(p,t,true);addCC(p,t,true);
  const tl=$('t-you');tl.classList.add('speaking');setTimeout(()=>tl.classList.remove('speaking'),Math.max(1800,t.length*70));
  if(!mute)speak(t,rec.lang);
  toast('Đã gửi tới cả lớp');
}
async function waitFor(f,ms){const t=Date.now();while(!f()&&Date.now()-t<ms)await sleep(120);}

function resetAll(){
  tok++;queue=[];busy=false;demoRun++;demoOn=false;updQ();
  rec.tok++;rec.state='idle';resetSignUI();
  avRig.go(clone(REST),400);setSpeaker(null);$('chips').innerHTML='';clearCC();
  $('log').innerHTML='<div class="empty">Chưa có tin nhắn</div>';
  document.querySelectorAll('.tile').forEach(t=>t.classList.remove('speaking'));
  $('demo').classList.remove('on');$('demoT').textContent='Demo';$('demoI').innerHTML=ic('play');
  try{speechSynthesis.cancel();}catch(e){}
}
</script>
<script>
/* ===== 7. tabs, controls, demo director, init ===== */
function tab(n){
  curTab=n;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===n));
  ['watch','sign','lib','log'].forEach(k=>$('v-'+k).classList.toggle('on',k===n));
  if(n==='watch')document.querySelector('#tabs [data-t=watch]').classList.remove('dot');
  $('views').scrollTop=0;
}
function panel(open){$('app').classList.toggle('nopanel',!open);document.querySelectorAll('.jsb').forEach(b=>b.classList.toggle('on',open));}
function renderPeople(){
  const box=$('ppl');box.innerHTML='';
  ['lan','minh','sarah'].forEach(id=>{const p=PEOPLE[id],b=document.createElement('button');b.type='button';b.style.setProperty('--c',p.c);b.setAttribute('aria-pressed',String(id===who));
    b.innerHTML='<u>'+p.ini+'</u><span></span>';b.querySelector('span').textContent=p.n;b.onclick=()=>{who=id;renderPeople();renderQP();};box.appendChild(b);});
}
function renderQP(){
  const box=$('qp');box.innerHTML='';
  QP[who].forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>say(who,t);box.appendChild(b);});
}
function renderSamples(){
  const box=$('samples');box.innerHTML='';
  PRESETS.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.textContent=p[rec.lang];b.onclick=()=>startSign(i);box.appendChild(b);});
}
function renderLib(q){
  const box=$('lib');box.innerHTML='';q=(q||'').toLowerCase().trim();
  Object.keys(SIGNS).filter(g=>!q||label(g).includes(q)).forEach(g=>{const b=document.createElement('button');b.type='button';b.textContent=label(g);b.onclick=()=>preview(g);box.appendChild(b);});
  if(!box.children.length)box.innerHTML='<div class="empty" style="grid-column:1/-1">Không tìm thấy ký hiệu</div>';
}
function setMute(m){mute=m;$('pgmic').classList.toggle('off',m);$('bmic').innerHTML=ic(m?'micoff':'mic');$('t-you').classList.toggle('muted',m);$('vbtn').innerHTML=ic(m?'volumeoff':'volume');if(m){try{speechSynthesis.cancel();}catch(e){}}}
function setCam(off){camOff=off;$('pgcam').classList.toggle('off',off);$('bcam').innerHTML=ic(off?'camoff':'cam');$('t-you').classList.toggle('camoff',off);$('camw').classList.toggle('off',off);if(off&&rec.state!=='idle')cancelSign();}

async function demo(){
  if(demoOn){resetAll();return;}
  resetAll();demoOn=true;const my=demoRun,alive=()=>my===demoRun&&demoOn;
  $('demo').classList.add('on');$('demoT').textContent='Dừng';$('demoI').innerHTML=ic('stop');
  panel(true);tab('watch');await sleep(700);if(!alive())return;
  say('lan',QP.lan[0]);say('minh',QP.minh[0]);await settle();if(!alive())return;await sleep(500);
  say('sarah',QP.sarah[0]);await settle();if(!alive())return;await sleep(400);
  say('lan',QP.lan[1]);await settle();if(!alive())return;await sleep(500);
  tab('sign');await sleep(700);if(!alive())return;
  startSign(0);await waitFor(()=>rec.state==='review',20000);if(!alive())return;await sleep(1800);if(!alive())return;
  submit();await sleep(3600);if(!alive())return;
  tab('watch');await sleep(400);say('lan',QP.lan[2]);say('sarah',QP.sarah[3]);await settle();if(!alive())return;await sleep(500);
  tab('sign');await sleep(700);if(!alive())return;
  startSign(1);await waitFor(()=>rec.state==='review',20000);if(!alive())return;await sleep(1800);if(!alive())return;
  submit();await sleep(3200);if(!alive())return;
  tab('watch');resetDemoBtn();
}
function resetDemoBtn(){demoOn=false;$('demo').classList.remove('on');$('demoT').textContent='Demo';$('demoI').innerHTML=ic('play');}

/* wiring */
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.t);};
$('spd').onclick=e=>{const b=e.target.closest('button');if(!b)return;spd=parseFloat(b.dataset.s);[...$('spd').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};
$('say').onsubmit=e=>{e.preventDefault();const v=$('txt').value;$('txt').value='';say(who,v);};
$('lang').onclick=e=>{const b=e.target.closest('button');if(!b)return;rec.lang=b.dataset.l;[...$('lang').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderSamples();if(rec.state==='review')$('sentT').textContent=PRESETS[rec.i][rec.lang];};
$('go').onclick=()=>startSign(null);$('cancel').onclick=cancelSign;$('redo').onclick=redoSign;$('submit').onclick=submit;
$('fq').oninput=e=>renderLib(e.target.value);
$('demo').onclick=demo;$('xp').onclick=()=>panel(false);
document.querySelectorAll('.jsb').forEach(b=>b.onclick=()=>panel($('app').classList.contains('nopanel')));
$('bmic').onclick=()=>{setMute(!mute);toast(mute?'Đã tắt giọng đọc. Tin nhắn chỉ hiện dạng chữ':'Đã bật giọng đọc. Tin nhắn được đọc thành tiếng');};
$('vbtn').onclick=()=>$('bmic').click();
$('bcam').onclick=()=>{setCam(!camOff);toast(camOff?'Đã tắt camera':'Đã bật camera');};
$('bcc').onclick=()=>{ccOn=!ccOn;$('bcc').classList.toggle('on',ccOn);if(!ccOn)clearCC();toast(ccOn?'Đã bật phụ đề':'Đã tắt phụ đề');};
$('bhand').onclick=()=>{const r=$('t-you').classList.toggle('raised');$('bhand').classList.toggle('on',r);chipText();};
$('bend').onclick=()=>{resetAll();toast('Đã đặt lại bản demo');};
$('bchat').onclick=()=>{panel(true);tab('log');};
$('binfo').onclick=()=>toast('Lớp 8B1 · 4 người');
$('bppl').onclick=()=>toast('4 người trong cuộc họp');
['brx','bpr','bmo'].forEach(id=>{$(id).onclick=()=>toast('Chức năng này không có trong bản demo');});
const av=$('avw');av.tabIndex=0;av.setAttribute('role','button');av.setAttribute('aria-label','Replay last signs');
const replay=()=>{if(lastMsg&&!busy)say(lastMsg.who,lastMsg.text,true);};
av.onclick=e=>{if(!e.target.closest('.spd'))replay();};
av.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();replay();}};

/* init */
(function(){
  buildStage();paint();renderPeople();renderQP();renderSamples();renderLib('');setSpeaker(null);
  const tick=()=>{const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('clk').textContent=t;$('clk2').textContent=t;};tick();setInterval(tick,30000);
  panel(window.innerWidth>900||true);
  requestAnimationFrame(frame);
})();
</script>

body,button,input{font-family:Roboto,Inter,Arial,sans-serif}.ppl{gap:6px}.ppl button{gap:6px;padding:0 8px 0 4px;font-size:13px}
