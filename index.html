<!doctype html><html lang="vi" class="land"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SignBridge · Họp trực tuyến cho học sinh Điếc</title>
<meta name="description" content="SignBridge: lời nói thành ký hiệu, ký hiệu thành chữ và giọng nói trong cuộc họp trực tuyến. Tạo phòng, gửi mã, tham gia ngay trên điện thoại.">
<meta property="og:title" content="SignBridge"><meta property="og:description" content="Cầu nối hai chiều giữa học sinh Điếc và cả lớp trong cuộc họp trực tuyến.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/room.css">
<style>html.land,html.land body{height:auto;min-height:100%;overflow:auto}</style>
</head><body>
<div class="lw">
  <header class="lh"><div class="logo"><span data-i="hand"></span></div><b>SignBridge</b><button class="pill-btn" id="lg" type="button" aria-label="Language"></button></header>

  <section class="hero">
    <div>
      <h1 data-t="homeTitle"></h1>
      <p class="sub" data-t="homeSub"></p>
      <div class="acts">
        <button class="btn f" id="newm" type="button"><span data-i="cam"></span><span data-t="newMeet"></span></button>
        <form class="joinf" id="jf" autocomplete="off">
          <input id="code" maxlength="7" inputmode="text" autocapitalize="characters" spellcheck="false" data-t-ph="joinCode" aria-label="Room code">
          <button class="btn" id="jb" type="submit" disabled data-t="joinBtn"></button>
        </form>
      </div>
      <div class="errt" id="err" role="alert"></div>
      <a class="demolink" href="demo.html" data-t="seeDemo"></a>
    </div>
    <div class="heroav" aria-hidden="true"><canvas id="cv"></canvas></div>
  </section>

  <section class="feats">
    <div class="feat"><b data-t="f1t"></b><p data-t="f1s"></p></div>
    <div class="feat"><b data-t="f2t"></b><p data-t="f2s"></p></div>
    <div class="feat"><b data-t="f3t"></b><p data-t="f3s"></p></div>
  </section>

  <footer class="lfoot" data-t="foot"></footer>
</div>
<script src="assets/i18n.js"></script>
<script src="assets/core.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/net.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  function lgHtml(){return SBI.get()==='vi'?'<b>VI</b> · EN':'VI · <b>EN</b>';}
  function render(){SBI.apply();paint();$('lg').innerHTML=lgHtml();}
  window.onSBLang=render;
  $('lg').onclick=function(){SBI.set(SBI.get()==='vi'?'en':'vi');};
  render();
  $('newm').onclick=function(){location.href='room/?c='+SBNet.newCode()+'&new=1';};
  var inp=$('code');
  inp.addEventListener('input',function(){
    var c=SBNet.normCode(inp.value);inp.value=SBNet.fmtCode(c);$('jb').disabled=c.length!==6;$('err').textContent='';
  });
  $('jf').onsubmit=function(e){
    e.preventDefault();var c=SBNet.normCode(inp.value);
    if(c.length!==6){$('err').textContent=SBI.t('badCode');return;}
    location.href='room/?c='+c;
  };
  /* hero avatar signs a short loop (placeholder signs) */
  var seq=['HELLO','WELCOME','THANK_YOU','GOOD'],i=0;
  (function step(){
    var g=seq[i++%seq.length],ks=keysFor(g),k=0;
    (function nx(){ if(k>=ks.length){avRig.go(clone(REST),500);setTimeout(step,1400);return;} avRig.go(ks[k++],450); setTimeout(nx,620); })();
  })();
  requestAnimationFrame(frame);
})();
</script>
</body></html>
